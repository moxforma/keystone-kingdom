<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Keystone Kingdom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Press+Start+2P&family=DotGothic16&family=Jersey+15&family=Pixelify+Sans:wght@500;700&family=Lilita+One&family=Lexend:wght@400;600;700&family=Atkinson+Hyperlegible+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-screen game shell in a centered 1100px column; screens swap in place over a night-sky adventure world. Single deliberate dark look. */
:root{
  --night:#1b1626; --panel:#2a2238; --panel2:#3a2f4e; --line:#4a3d62;
  --ink:#efe6d8; --muted:#b8a9c9; --volt:#7fd8d0; --gold:#f0c860; --good:#4de08a; --bad:#ff6b7a;
  --display:'Jersey 10','DotGothic16',system-ui,sans-serif;
  --title:'Press Start 2P','Jersey 10',monospace;
  --body:'Jersey 10','DotGothic16',system-ui,sans-serif;
  --mono:'Jersey 10',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  background-image:radial-gradient(1100px 600px at 85% -10%,#3a2a56 0%,transparent 60%),radial-gradient(900px 500px at -10% 110%,#1e3a3a 0%,transparent 55%);background-attachment:fixed}
.sky{position:fixed;inset:0;pointer-events:none;opacity:.55;
  background-image:radial-gradient(1.5px 1.5px at 20px 30px,#fff 50%,transparent 51%),radial-gradient(1px 1px at 90px 120px,#cfe8ff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 160px 60px,#fff 50%,transparent 51%),radial-gradient(1px 1px at 230px 170px,#ffe9a8 50%,transparent 51%);
  background-size:260px 220px}
.app{position:relative;max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:12px 28px}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.01em;text-wrap:balance;margin:0}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--volt);outline-offset:2px}
.muted{color:var(--muted)}
.btn{font-family:var(--display);font-size:20px;letter-spacing:.02em;padding:12px 22px;border-radius:14px;border:0;cursor:pointer;background:var(--gold);color:#2a1d00;box-shadow:0 5px 0 #b3850f;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b3850f}
.btn.alt{background:var(--panel2);color:var(--ink);box-shadow:0 5px 0 #0a0f2e}
.btn.volt{background:var(--volt);color:#00303a;box-shadow:0 5px 0 #1a9fb3}
.btn.sm{font-size:16px;padding:8px 14px;border-radius:11px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:12px;border:0;background:var(--panel2);cursor:pointer;box-shadow:0 4px 0 #0a0f2e}
.icon-btn svg{width:22px;height:22px}
.gem{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-size:20px;color:var(--volt)}
.gem svg{width:20px;height:20px}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.topbar h2{font-size:30px;flex:1 1 200px;min-width:0}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:20px}

/* ---------- HOME ---------- */
.logo{display:flex;flex-direction:column;align-items:center;margin:6px 0 10px;line-height:.9}
.logo .l1{font-family:var(--display);font-size:clamp(46px,9vw,92px);color:var(--gold);text-shadow:0 5px 0 #b3570f,0 0 30px rgba(255,201,60,.35);letter-spacing:.04em}
.logo .l2{font-family:var(--display);font-size:clamp(26px,4.5vw,44px);color:var(--volt);letter-spacing:.35em;margin-top:4px;padding-left:.35em}
.home-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:20px;align-items:center}
.hero-big{position:relative;display:grid;place-items:center;min-height:300px}
.hero-big .zk{width:min(300px,80%);filter:drop-shadow(0 18px 20px rgba(0,0,0,.45))}
.hero-big .pad{position:absolute;bottom:4%;width:60%;height:34px;border-radius:50%;background:radial-gradient(closest-side,rgba(62,230,255,.45),transparent)}
.say{position:absolute;top:2%;right:0;max-width:230px;background:#fff;color:#1a1f4a;border-radius:16px;padding:10px 14px;font-weight:600;font-size:15px}
.say::after{content:"";position:absolute;left:24px;bottom:-10px;border:10px solid transparent;border-top-color:#fff;border-bottom:0}
.tcard{padding:20px;display:grid;gap:14px}
.tname{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.tname h2{font-size:32px}
.lvl{font-family:var(--display);color:var(--gold);font-size:20px}
.xpbar{height:14px;background:#0c1238;border-radius:10px;overflow:hidden;border:2px solid var(--line)}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--volt),#7c5cff);border-radius:8px;transition:width .6s}
.trow{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.trow b{font-family:var(--display);font-size:22px;color:var(--ink);font-weight:400;display:block}
.badges{display:flex;gap:10px;flex-wrap:wrap}
.badge{width:44px;height:48px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:#2a3270;display:grid;place-items:center;font-family:var(--display);font-size:13px;color:#0b1033}
.badge.got{background:var(--bc);box-shadow:inset 0 0 0 4px rgba(255,255,255,.3)}
.hbtns{display:flex;flex-wrap:wrap;gap:12px}
.hbtns .btn.big{font-size:24px;flex:1 1 100%}
.namebox{display:flex;gap:8px;flex-wrap:wrap}
.namebox input{flex:1;min-width:0;font:600 20px var(--body);padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:#0c1238;color:var(--ink)}
.note{font-size:13px;color:var(--muted)}

/* ---------- MAP ---------- */
.region{margin-bottom:26px}
.rhead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.rhead h3{font-size:26px;color:var(--rc)}
.rhead p{margin:0;font-size:14px}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.lesson{padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border-color:color-mix(in srgb,var(--rc) 35%,var(--line))}
.lesson .lt{min-width:0}
.lesson .lt h4{margin:0;font-family:var(--display);font-weight:400;font-size:19px}
.lesson .lt .num{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.minikeys{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.minikeys span{font:700 14px var(--mono);min-width:24px;height:24px;display:grid;place-items:center;border-radius:6px;background:color-mix(in srgb,var(--fc) 25%,var(--panel2));border-bottom:3px solid var(--fc);padding:0 4px}
.nodes{display:flex;gap:8px}
.node{width:64px;display:grid;justify-items:center;gap:2px;background:none;border:0;cursor:pointer;padding:0}
.node .nc{width:58px;height:58px;border-radius:16px;background:#0c1238;border:2px solid var(--line);display:grid;place-items:center;overflow:hidden}
.node .nc svg.cr{width:62px;height:62px}
.node .nc .sil{filter:brightness(0);opacity:.35}
.node .nl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.node .ns{font-size:12px;color:var(--gold);letter-spacing:1px;height:14px}
.node.next .nc{border-color:var(--gold);box-shadow:0 0 0 4px rgba(255,201,60,.25);animation:pulse 1.6s infinite}
.node.locked{cursor:not-allowed}
.node.locked .nc{opacity:.5}
.node.locked svg.lock{width:22px;height:22px}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,201,60,.08)}}

/* ---------- PLAY ---------- */
#s-play{display:flex;flex-direction:column;gap:10px}
.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hud .ht{flex:1;min-width:150px}
.hud .ht b{font-family:var(--display);font-weight:400;font-size:20px;display:block;line-height:1.1}
.hud .ht span{font-size:13px;color:var(--muted)}
.stat{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:4px 12px;text-align:center;min-width:70px}
.stat b{font-family:var(--display);font-weight:400;font-size:20px;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.arena{position:relative;height:clamp(190px,30vh,260px);border-radius:22px;overflow:hidden;border:2px solid var(--line);
  background:linear-gradient(180deg,color-mix(in srgb,var(--rc,#4de08a) 22%,#101848) 0%,#151d4d 70%)}
.arena .ground{position:absolute;left:-10%;right:-10%;bottom:-60%;height:95%;border-radius:50%;background:color-mix(in srgb,var(--rc,#4de08a) 30%,#0c1238)}
.hero,.foe{position:absolute;bottom:4%;width:min(30%,190px)}
.hero{left:5%}
.foe{right:6%}
.hero svg,.foe svg{width:100%;display:block}
.hero .zk{animation:bob 2.4s ease-in-out infinite}
.foe .cr{animation:bob 2.8s ease-in-out infinite}
.hero.cheer .zk{animation:hop .5s ease-out 2}
.foe.hit .cr{animation:hit .25s}
.foe.dodge .cr{animation:dodge .35s}
.foe.friend .cr{animation:hop .55s ease-out 3}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes hop{40%{transform:translateY(-26px) scale(1.04)}}
@keyframes hit{30%{transform:translateX(8px);filter:brightness(1.8)}}
@keyframes dodge{30%{transform:translateX(18px) rotate(8deg)}70%{transform:translateX(-6px)}}
.bubble{position:absolute;left:calc(5% + min(30%,190px) - 20px);top:8%;max-width:min(42%,330px);background:#fff;color:#1a1f4a;border-radius:16px;padding:9px 13px;font-weight:600;font-size:clamp(13px,1.8vw,16px);z-index:3;transition:transform .2s}
.bubble::after{content:"";position:absolute;left:-9px;bottom:14px;border:9px solid transparent;border-right-color:#fff;border-left:0}
.bubble.pop{transform:scale(1.06)}
.bubble.bad{background:#ffe2e6}
.bubble.bad::after{border-right-color:#ffe2e6}
.fmeter{position:absolute;right:4%;top:7%;width:min(40%,260px);text-align:right;z-index:2}
.fmeter .fname{font-family:var(--display);font-size:clamp(16px,2.4vw,22px)}
.fmeter .bar{height:14px;border-radius:10px;background:#0c1238;border:2px solid rgba(255,255,255,.25);overflow:hidden;margin-top:3px}
.fmeter .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff8fc8,#ff5d8f);transition:width .2s}
.fmeter .flab{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.zap{position:absolute;left:26%;top:48%;width:44px;height:44px;z-index:2;pointer-events:none;animation:fly .36s ease-in forwards;filter:drop-shadow(0 0 8px var(--fc))}
.zap.super{width:80px;height:80px;top:36%}
@keyframes fly{from{left:26%;transform:scale(.5) rotate(-20deg);opacity:.8}to{left:70%;transform:scale(1) rotate(10deg);opacity:1}}
.heart{position:absolute;right:18%;bottom:40%;font-size:26px;color:#ff5d8f;animation:rise 1.2s ease-out forwards;z-index:2}
@keyframes rise{to{transform:translateY(-110px) scale(1.4);opacity:0}}
.strip-wrap{display:grid;gap:4px}
.strip{position:relative;overflow:hidden;height:clamp(70px,11vw,92px);border-radius:18px;background:#0c1238;border:2px solid var(--line);
  mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent)}
.strip-in{position:absolute;top:0;bottom:0;left:0;display:flex;align-items:center;white-space:pre;transition:transform .18s ease-out;font-family:var(--mono);font-weight:700;font-size:clamp(28px,5vw,44px)}
.strip-in span{display:inline-block;min-width:.72em;text-align:center;color:#6f79b8;padding:2px 1px;border-radius:8px}
.strip-in span.sp{color:#39427e}
.strip-in span.ok{color:var(--good)}
.strip-in span.fix{color:var(--gold)}
.strip-in span.cur{color:#fff;background:color-mix(in srgb,var(--fc) 30%,transparent);box-shadow:inset 0 -5px 0 var(--fc);transform:scale(1.25);margin:0 6px}
.strip.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.fhint{min-height:26px;text-align:center;font-weight:600;font-size:15px;color:var(--muted)}
.fhint .chip{display:inline-grid;place-items:center;min-width:28px;height:26px;padding:0 6px;border-radius:7px;font:700 16px var(--mono);color:#0b1033;background:var(--fc);margin:0 4px}
.fhint b{color:var(--fc)}
.caps-warn{color:var(--bad)}
.kbwrap{display:grid;grid-template-columns:1fr 250px;gap:12px;align-items:center}
.kb{display:grid;gap:5px;padding:10px;border-radius:18px;background:var(--panel);border:2px solid var(--line)}
.krow{display:flex;gap:5px}
.krow.last{justify-content:center}
.key{height:clamp(30px,4.6vw,46px);min-width:0;border-radius:9px;border:0;font:700 clamp(11px,1.7vw,17px) var(--mono);color:var(--ink);cursor:pointer;
  background:color-mix(in srgb,var(--fc) 16%,var(--panel2));box-shadow:inset 0 -4px 0 color-mix(in srgb,var(--fc) 70%,#000);position:relative;padding:0}
.key.fn{font-size:clamp(9px,1.2vw,12px);font-family:var(--body);text-transform:lowercase;color:var(--muted)}
.key.off{opacity:.3}
.key.bump::after{content:"";position:absolute;left:35%;right:35%;bottom:7px;height:3px;border-radius:2px;background:currentColor;opacity:.8}
.key.tgt{background:var(--fc);color:#0b1033;opacity:1;box-shadow:0 0 0 3px #fff,0 0 18px var(--fc);animation:tgt .9s ease-in-out infinite;z-index:1}
.key.hl{background:color-mix(in srgb,var(--fc) 60%,var(--panel2));opacity:1}
.key.press{transform:translateY(2px)}
@keyframes tgt{50%{transform:translateY(-2px)}}
.hands svg{width:100%;display:block}
.fing{opacity:.28;stroke:#0b1033;stroke-width:3;transition:opacity .15s}
.fing.on{opacity:1;stroke:#fff;stroke-width:4;filter:drop-shadow(0 0 6px rgba(255,255,255,.7))}
.palm{fill:#2c3576;stroke:#0b1033;stroke-width:3}
.hands text{fill:var(--muted);font:600 13px var(--body);letter-spacing:.1em}
/* intro / camp inside arena */
.intro{position:absolute;inset:0;display:grid;grid-template-columns:minmax(90px,26%) 1fr;align-items:center;gap:10px;padding:14px 18px;z-index:2}
.intro .zk{width:100%;animation:bob 2.4s ease-in-out infinite}
.intro .ib{display:grid;gap:6px;justify-items:start}
.intro .tag{font:700 12px var(--body);letter-spacing:.14em;color:var(--gold);text-transform:uppercase}
.intro h3{font-size:clamp(20px,3.2vw,30px)}
.intro p{margin:0;font-size:clamp(14px,1.9vw,17px);max-width:52ch}
.intro .row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bigkey{font:700 clamp(34px,6vw,54px) var(--mono);min-width:1.6em;height:1.6em;padding:0 .2em;display:grid;place-items:center;border-radius:14px;color:#0b1033;background:var(--fc);box-shadow:inset 0 -6px 0 rgba(0,0,0,.25),0 0 24px var(--fc)}
.dots{display:flex;gap:8px}
.dots i{width:18px;height:18px;border-radius:50%;border:3px solid var(--fc);display:block}
.dots i.on{background:var(--fc)}
/* ---------- CARDS ---------- */
.cw{container-type:inline-size;min-width:0}
.card{position:relative;aspect-ratio:5/7;border-radius:6cqi;padding:4cqi;display:flex;flex-direction:column;gap:2.5cqi;overflow:hidden;
  background:linear-gradient(165deg,color-mix(in srgb,var(--tc) 55%,#1a2260),#141b48 70%);border:3cqi solid color-mix(in srgb,var(--tc) 70%,#fff);box-shadow:0 8px 20px rgba(0,0,0,.35)}
.c-top{display:flex;justify-content:space-between;align-items:baseline;gap:2cqi}
.c-name{font-family:var(--display);font-size:11cqi;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-form{font-size:6.5cqi;font-weight:700;text-transform:uppercase;opacity:.8}
.c-art{border-radius:4cqi;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--tc) 45%,#fff) 0%,color-mix(in srgb,var(--tc) 30%,#0c1238) 75%);border:1.5cqi solid rgba(255,255,255,.55);aspect-ratio:1/0.82;display:grid;place-items:center;overflow:hidden}
.c-art svg{width:92%}
.c-type{display:flex;justify-content:space-between;align-items:center}
.tpill{font-size:6.5cqi;font-weight:700;padding:.8cqi 3cqi;border-radius:10cqi;background:var(--tc);color:#0b1033;text-transform:uppercase;letter-spacing:.05em}
.c-rar{color:var(--gold);font-size:8cqi;letter-spacing:.5cqi}
.c-flav{margin:0;font-size:6.5cqi;line-height:1.3;color:#dfe4ff;flex:1}
.c-foot{font-size:5.5cqi;color:rgba(255,255,255,.65);letter-spacing:.08em;text-transform:uppercase}
.card.holo::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:color-dodge;opacity:.55;
  background:linear-gradient(115deg,transparent 20%,#ff8fc8 30%,#ffd84d 38%,#4de08a 46%,#3ee6ff 54%,#a78bfa 62%,transparent 72%);background-size:250% 250%;animation:holo 3.5s linear infinite}
@keyframes holo{from{background-position:120% 0}to{background-position:-120% 0}}
.card.back{background:repeating-linear-gradient(45deg,#1b2360 0 10px,#172057 10px 20px);border-color:#2e3a80;display:grid;place-items:center}
.card.back span{font-family:var(--display);font-size:30cqi;color:#2e3a80}
.flip{perspective:900px;width:min(220px,60vw);margin:0 auto}
.flip .fi{position:relative;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,1.4,.5,1);transform:rotateY(180deg)}
.flip.go .fi{transform:rotateY(0)}
.flip .cw{backface-visibility:hidden}
.flip .cw.bk{position:absolute;inset:0;transform:rotateY(180deg)}
/* ---------- BINDER / SHOP ---------- */
.binder{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.bgroup{display:contents}
.shop-top{display:grid;grid-template-columns:260px 1fr;gap:20px;align-items:start}
.shop-hero{padding:16px;display:grid;justify-items:center;gap:8px;position:sticky;top:12px}
.shop-hero .zk{width:100%;max-width:220px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.item{padding:10px;display:grid;gap:6px;justify-items:center;text-align:center}
.item .zk{width:100px}
.item h4{margin:0;font-family:var(--display);font-weight:400;font-size:17px}
.item .slot{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.item.eq{border-color:var(--gold)}
/* ---------- MODAL ---------- */
.modal{position:fixed;inset:0;background:rgba(5,8,30,.72);display:grid;place-items:center;z-index:1000;padding:12px;overflow:hidden}
.mbox{background:var(--panel);border:3px solid var(--line);border-radius:24px;padding:22px;width:min(560px,100%);max-height:calc(100% - 20px);overflow:auto;text-align:center;display:grid;gap:14px;animation:popin .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes popin{from{transform:scale(.85);opacity:0}}
.mbox h2{font-size:32px}
.bigstars{display:flex;justify-content:center;gap:8px}
.bigstars svg{width:54px;height:54px;fill:#2a3270;stroke:#0b1033;stroke-width:1.5}
.bigstars svg.on{fill:var(--gold);animation:starpop .5s cubic-bezier(.3,1.8,.5,1) both}
.bigstars svg.on:nth-child(2){animation-delay:.25s}.bigstars svg.on:nth-child(3){animation-delay:.5s}
@keyframes starpop{from{transform:scale(0) rotate(-90deg)}}
.rstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rstats div{background:#0c1238;border-radius:12px;padding:8px 4px}
.rstats b{font-family:var(--display);font-weight:400;font-size:24px;display:block;font-variant-numeric:tabular-nums}
.rstats span{font-size:11px;color:var(--muted)}
.banner{border-radius:14px;padding:10px 14px;font-family:var(--display);font-size:20px;background:linear-gradient(90deg,#7c5cff,#3ee6ff);color:#fff}
.banner.gold{background:linear-gradient(90deg,#ff9f45,#ffc93c);color:#2a1d00}
.rbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;padding:10px 0;border-bottom:1px solid var(--line)}
.seg{display:flex;gap:6px}
.seg button{border:2px solid var(--line);background:#0c1238;border-radius:10px;padding:6px 12px;cursor:pointer;font-weight:600}
.seg button.on{background:var(--volt);color:#00303a;border-color:var(--volt)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--gold);color:#2a1d00;font-family:var(--display);font-size:20px;padding:10px 20px;border-radius:14px;z-index:1100;box-shadow:0 6px 20px rgba(0,0,0,.4)}


/* ---------- V2 ---------- */
.linkbtn{background:none;border:0;padding:0;color:var(--volt);font:inherit;font-weight:600;text-decoration:underline;cursor:pointer}
.eggrow{display:flex;align-items:center;gap:12px;background:#0c1238;border-radius:14px;padding:8px 12px}
.eggrow .egg{width:44px;flex:none}
.eggrow b{font-family:var(--display);font-weight:400;font-size:18px;display:block}
.key.nolab{color:transparent}
.foe.boss{width:min(38%,240px)}
.foe.boss .cr{filter:drop-shadow(0 0 16px var(--rc))}
.node.boss .nl{color:var(--gold)}
.hero-mini{width:110px;margin:0 auto}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.game{padding:18px;display:grid;gap:8px;justify-items:start}
.game h3{font-size:28px}.game p{margin:0}
.gart{width:100%;height:140px;border-radius:14px;background:#0c1238;display:flex;align-items:center;justify-content:center;gap:4px;overflow:hidden}
.gart svg{height:118px;width:auto}
#s-game{display:flex;flex-direction:column;gap:10px}
.garena{position:relative;height:clamp(270px,44vh,400px);border-radius:22px;overflow:hidden;border:2px solid var(--line);background:linear-gradient(180deg,#070b26,#1b1f5e 85%)}
.city{position:absolute;left:0;right:0;bottom:0;width:100%;height:60px}
.gz{position:absolute;left:50%;bottom:4px;width:86px;transform:translateX(-50%);z-index:2}
.gz .zk{animation:bob 2.4s ease-in-out infinite}
.gb{left:auto;right:3%;top:4%;max-width:40%}
.gb::after{display:none}
.met{position:absolute;top:0;width:76px;height:76px;margin-left:-38px;z-index:1}
.met .rock{position:absolute;inset:8px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#a07a5a,#5b3d2a 72%);border:3px solid #0b1033;box-shadow:0 -22px 26px -8px rgba(255,140,60,.75)}
.met .mt{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:700 28px var(--mono);color:#fff;background:rgba(11,16,51,.75);border-radius:10px;padding:0 8px;white-space:nowrap}
.met .mt i{font-style:normal}.met .mt i.on{color:var(--good)}
.met.boom>*{animation:boom .45s forwards}.met.land>*{animation:boom .45s forwards;filter:hue-rotate(-40deg)}
@keyframes boom{to{transform:translate(-50%,-50%) scale(2);opacity:0}}
.met.boom .rock,.met.land .rock{animation-name:boomr}
@keyframes boomr{to{transform:scale(2);opacity:0}}
.beam{position:absolute;height:5px;background:linear-gradient(90deg,var(--volt),#fff);transform-origin:0 50%;border-radius:3px;box-shadow:0 0 12px var(--volt);z-index:2}
.race-arena{background:linear-gradient(180deg,#14402f,#0e2c22)}
.lane{position:relative;height:25%;border-bottom:2px dashed rgba(255,255,255,.18)}
.runner{position:absolute;left:0;bottom:2px;height:92%;aspect-ratio:1;transition:left .25s linear}
.runner svg{height:100%;width:auto;display:block}
.runner.trip svg{animation:dodge .35s}
.finish{position:absolute;right:5%;top:0;bottom:0;width:14px;background:repeating-linear-gradient(0deg,#fff 0 10px,#0b1033 10px 20px);opacity:.8}
.ptiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.ptiles .panel{padding:12px}
.ptiles b{font-family:var(--display);font-weight:400;font-size:28px;display:block;font-variant-numeric:tabular-nums}
.ptiles span{font-size:13px;color:var(--muted)}
.pgrid{display:grid;grid-template-columns:1.1fr 1fr;gap:12px;margin-bottom:12px}
.pbox{padding:16px;display:grid;gap:10px;align-content:start;min-width:0}
.pbox h3{font-size:22px}
.chartwrap{overflow-x:auto}.chart{width:100%;min-width:320px;display:block}
.ct{fill:#a3acdf;font:12px var(--body)}
.heat{display:grid;gap:4px;overflow-x:auto}
.hrow{display:flex;gap:4px}
.hk{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;line-height:1;flex:none}
.hk b{font:700 14px var(--mono)}.hk span{font-size:10px}
.chip2{display:inline-block;background:#ff6b7a;color:#0b1033;border-radius:8px;padding:2px 8px;font-weight:700;margin:2px}
.plist{margin:0;padding-left:20px;display:grid;gap:6px}
.plist a{color:var(--volt)}

/* ---------- V3 depth + action ---------- */
.panel{background:linear-gradient(180deg,#1b245c,#141b4a);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 12px 30px rgba(0,0,0,.35)}
.logo .l1{text-shadow:0 1px 0 #f0b52c,0 2px 0 #e0a020,0 3px 0 #cc8a14,0 4px 0 #b8740a,0 5px 0 #a25f04,0 6px 0 #8a4c00,0 12px 18px rgba(0,0,0,.55),0 0 40px rgba(255,201,60,.35);background:linear-gradient(180deg,#fff2b0,#ffc93c 55%,#ff9f1c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 #8a4c00)}
.logo .l2{text-shadow:0 3px 0 #1a7f95,0 0 20px rgba(62,230,255,.6)}
.key{background:linear-gradient(180deg,color-mix(in srgb,var(--fc) 28%,#2c3680),color-mix(in srgb,var(--fc) 12%,#171e56));box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -4px 0 color-mix(in srgb,var(--fc) 70%,#000),0 3px 6px rgba(0,0,0,.4)}
.key.tgt{background:linear-gradient(180deg,#fff,var(--fc) 45%)}
.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.arena{box-shadow:inset 0 0 60px rgba(0,0,0,.55),0 12px 30px rgba(0,0,0,.35)}
.arena .fmeter,.arena .bubble,.arena .hero,.arena .foe,.arena .villain,.arena .intro{z-index:2}
.hero{width:min(26%,175px)}
.villain{position:absolute;right:22%;bottom:5%;width:min(25%,170px)}
.villain svg,.captive svg{width:100%;display:block;overflow:visible}
.villain .gl{animation:jit 2.2s infinite}
.villain.hit .gl{animation:vhit .22s}
.villain.boss{width:min(32%,215px);right:19%}
.villain.pop .gl{animation:vpop .5s forwards}
.villain.laugh .gl{animation:hop .45s 2}
@keyframes jit{0%,88%,100%{transform:none}90%{transform:translate(4px,-2px) skewX(6deg)}93%{transform:translate(-5px,1px)}96%{transform:translate(2px,0) skewX(-4deg)}}
@keyframes vhit{40%{transform:translateX(10px) scale(.95);filter:brightness(2.2) saturate(.3)}}
@keyframes vpop{60%{transform:scale(1.35);filter:brightness(3)}to{transform:scale(.2);opacity:0;filter:brightness(4)}}
.gl .px{animation:flick .5s steps(2) infinite}
@keyframes flick{50%{opacity:.2;transform:translateX(3px)}}
.foe{right:3%;bottom:18%;width:min(17%,115px)}
.foe .cage{border-radius:50%;padding:8%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.45),rgba(159,123,216,.12) 45%,rgba(159,123,216,.35));border:3px solid rgba(159,123,216,.75);box-shadow:0 0 22px rgba(159,123,216,.55),inset 0 0 18px rgba(159,123,216,.45);transition:all .4s}
.foe.friend .cage{background:none;border-color:transparent;box-shadow:none}
.foe.friend{width:min(22%,150px)}
.fmeter .bar i{background:linear-gradient(90deg,#9f7bd8,#ff8a1f)}
.hero.recoil .zk{animation:recoil .14s}
@keyframes recoil{40%{transform:translateX(-7px) scale(1.03)}}
.arena.quake,.garena.quake{animation:shake .3s}
.laser{position:absolute;height:9px;margin-top:-4.5px;transform-origin:0 50%;border-radius:6px;pointer-events:none;z-index:6;background:linear-gradient(90deg,transparent,var(--fc) 8%,#fff 50%,var(--fc) 92%);box-shadow:0 0 10px var(--fc),0 0 26px var(--fc);animation:las .24s ease-out forwards}
.laser.big{height:18px;margin-top:-9px}
@keyframes las{0%{clip-path:inset(0 100% 0 0)}25%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 0 80%);opacity:.2}}
.impact{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;pointer-events:none;z-index:7;background:radial-gradient(circle,#fff 0 16%,var(--fc) 30%,transparent 66%);animation:imp .28s ease-out forwards}
.impact.big{width:130px;height:130px;margin:-65px 0 0 -65px}
@keyframes imp{from{transform:scale(.3)}to{transform:scale(1.5);opacity:0}}
.shard{position:absolute;width:9px;height:9px;z-index:7;pointer-events:none;animation:shard .65s ease-out forwards}
@keyframes shard{to{transform:translate(var(--dx),var(--dy)) rotate(200deg) scale(.3);opacity:0}}
.glitch-arena{height:clamp(330px,56vh,520px);background:#07041c}
.glitch-arena .dash{animation:dash .7s linear infinite}
@keyframes dash{to{stroke-dashoffset:-56}}
.gz-l{left:4%;transform:none;width:min(16%,110px);bottom:2%}
.ent{position:absolute;left:0;top:0;width:150px;height:150px;transform-origin:0 0;will-change:transform}
.ent svg{width:100%;height:100%;display:block;overflow:visible}
.ent.bad .gl{animation:jit 1.9s infinite}
.ent.hit svg{animation:vhit .2s}
.ent.pop svg{animation:vpop .45s forwards}
.ent.bonk svg{animation:vpop .4s forwards}
.ent.saved svg{animation:hop .5s 1}
.ent.friend .cr{animation:bob .5s infinite}
.ent.locked::after{content:"";position:absolute;inset:-6%;border:4px dashed #ffe23d;border-radius:50%;animation:spin 3s linear infinite}
.ent.bossent .gl{animation:jit 1.4s infinite}
.ent.stomp svg{animation:hop .4s}
@keyframes spin{to{transform:rotate(360deg)}}
.elab{position:absolute;left:0;top:0;white-space:nowrap;background:rgba(11,8,40,.9);border:2px solid #9f7bd8;border-radius:12px;padding:3px 10px;font-family:var(--mono);font-weight:700;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.5);text-align:center;pointer-events:none}
.elab.friend{border-color:#4de08a}
.elab em{display:block;font:600 11px var(--body);color:#4de08a;font-style:normal;letter-spacing:.06em;text-transform:uppercase}
.elab i{font-style:normal}.elab i.on{color:var(--good)}.elab i.nx{color:#0b1033;background:#ffe23d;border-radius:4px}
.cbar{height:8px;border-radius:5px;background:#2a1450;margin-top:4px;overflow:hidden}.cbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffe23d,#e0707a)}
.bhp{font-size:14px;color:#9f7bd8;letter-spacing:3px}
.gcombo{position:absolute;right:3%;bottom:4%;font-family:var(--display);font-size:clamp(20px,3vw,30px);color:#ffe23d;text-shadow:0 3px 0 #8a4c00;z-index:250}
.gcombo.hot{color:#9f7bd8;text-shadow:0 0 14px #9f7bd8}
.gmsg{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(22px,4vw,40px);color:#fff;text-shadow:0 4px 0 #3a1a7a,0 0 20px #9f7bd8;opacity:0;z-index:400;pointer-events:none;white-space:nowrap}
.gmsg.big{font-size:clamp(34px,7vw,64px)}.gmsg.bad{color:#ff6b7a}.gmsg.good{color:#4de08a}
.gmsg.show{animation:msg 1.6s ease-out forwards}
@keyframes msg{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}
.gflash{position:absolute;inset:0;background:radial-gradient(circle,transparent 40%,rgba(255,40,80,.6));opacity:0;pointer-events:none;z-index:350}
.gflash.on{animation:flash .5s}
@keyframes flash{20%{opacity:1}}
.grade{font-family:var(--display);font-size:90px;line-height:1;margin:0 auto;width:130px;height:130px;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff5c2,#ffc93c 45%,#b3570f);color:#5a2a00;text-shadow:0 3px 0 rgba(255,255,255,.5);box-shadow:0 10px 30px rgba(255,201,60,.4);animation:starpop .6s cubic-bezier(.3,1.8,.5,1)}
.grade.gS{background:radial-gradient(circle at 35% 30%,#fff,#c8a8e8 45%,#7c2bd6);color:#3a0060}
.game.feature{border-color:#9f7bd8;box-shadow:0 0 0 3px rgba(159,123,216,.2),0 12px 30px rgba(0,0,0,.35)}
.gart.dark{background:linear-gradient(180deg,#1a0a3a,#3a1466)}

/* ---------- V4 pixel look ---------- */
*:not(.fing):not(.palm){border-radius:0!important}
svg image{image-rendering:pixelated;image-rendering:crisp-edges}
.btn{box-shadow:0 5px 0 #b3850f,4px 9px 0 rgba(0,0,0,.35)}
.panel,.kb,.arena,.garena,.mbox,.stat,.icon-btn{box-shadow:6px 6px 0 rgba(4,6,24,.65)}
.panel,.arena,.garena,.mbox{border-width:4px}
.logo .l1{font-weight:700;letter-spacing:.06em;text-shadow:4px 4px 0 #8a4c00,8px 8px 0 rgba(0,0,0,.35);background:none;color:var(--gold);filter:none}
.logo .l2{font-weight:700}
.hero .zk,.foe .cr,.intro .zk,.villain .gl,.ent svg{filter:none}
.laser{border-radius:0;background:var(--fc);box-shadow:0 0 0 3px #fff inset,0 0 0 2px rgba(255,255,255,.4);height:8px;margin-top:-4px;animation:las .18s steps(3) forwards}
.laser.big{height:14px;margin-top:-7px}
.impact{background:none;border:6px solid var(--fc);box-shadow:inset 0 0 0 6px #fff;animation:imp .25s steps(3) forwards}
.shard{width:8px;height:8px}
.foe .cage{background:rgba(159,123,216,.18);border:4px solid #9f7bd8;box-shadow:none}
.foe.caught .cage{animation:shrink .35s steps(4) forwards}
@keyframes shrink{to{transform:scale(0);opacity:0}}
.kstone{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;z-index:8}
.kstone svg{width:100%;height:100%;display:block;animation:spin .5s steps(4) infinite}
.kstone.wob svg{animation:wob .4s steps(2) 3}
.kstone.click svg{animation:none;transform:scale(1.25)}
@keyframes wob{25%{transform:rotate(-20deg)}75%{transform:rotate(20deg)}}
.card{border-width:3cqi}
.c-art{background:color-mix(in srgb,var(--tc) 35%,#0c1238)}

/* ---------- V5 rare tiers + pixel hands ---------- */
.card.gold{background:linear-gradient(160deg,#8a6420,#3a2408 75%);border-color:#f0c860}
.card.gold .c-art{background:radial-gradient(circle at 50% 45%,#fff2b8,#c8961e 80%)}
.card.diamond{background:linear-gradient(160deg,#7aa0e0,#2a2c6a 75%);border-color:#e6f8ff}
.card.diamond .c-art{background:radial-gradient(circle at 50% 45%,#ffffff,#8ab4e8 80%)}
.card.gold::before,.card.diamond::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.55) 45%,transparent 55%);background-size:300% 100%;animation:holo 2.6s steps(12) infinite}
.card.gold .c-name::after{content:" ★";color:#ffe27a}.card.diamond .c-name::after{content:" ◆";color:#e6f8ff}
.banner.dia{background:linear-gradient(90deg,#8ab4e8,#e6f8ff,#c8a8ff);color:#1a1450}
.foe .cr.gold,.foe .cr.diamond{animation:bob 2.8s ease-in-out infinite,rare 1s steps(2) infinite}
@keyframes rare{50%{filter:brightness(1.35)}}
.hands canvas{width:100%;image-rendering:pixelated;display:block}
.hlab{display:flex;justify-content:space-around;font:700 12px var(--display);letter-spacing:.12em;color:var(--muted);margin-top:4px}

/* ---------- V6 ---------- */
.cardbtn{all:unset;cursor:pointer;display:block;transition:transform .1s}
.cardbtn:hover{transform:translateY(-4px)}.cardbtn:focus-visible{outline:3px solid var(--volt)}
.bigcard{width:min(300px,80vw);margin:0 auto}.bigcard .c-name{font-size:9cqi}.c-name{font-size:9.5cqi}
.hands{max-width:300px;justify-self:center;width:100%}
.rbadges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.rb{padding:4px 12px;font-family:var(--display);font-size:18px;background:#3a2f4e;color:var(--ink)}
.rb.gold{background:#f0c860;color:#3a2408}.rb.dia{background:linear-gradient(90deg,#bfe2f6,#ffffff,#d8c8ff);color:#1a1450}.rb.holo{background:linear-gradient(90deg,#ff8fc8,#ffd84d,#4de08a,#3ee6ff);color:#1a1450}
.forms{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fthumb{background:#1b1626;border:3px solid var(--line);padding:6px;display:grid;justify-items:center}
.fthumb.on{border-color:var(--gold)}.fthumb svg{width:100%;max-width:90px}.fthumb span{font-family:var(--display);font-size:36px;color:var(--line);height:70px;display:grid;place-items:center}
.fthumb small{color:var(--muted)}
.item.lockd svg{filter:grayscale(1) brightness(.6)}

/* ---------- V7 ---------- */
h1,h2,h3,.btn,.lvl,.banner{letter-spacing:.03em}.banner{font-size:22px}.logo .l1,.logo .l2{font-family:var(--display)}
.say,.bubble{border:3px solid #2a1d3e;box-shadow:4px 4px 0 rgba(10,6,20,.45);background:#fffaf0;color:#2a1d3e}
.say::after{content:"";position:absolute;left:22px;bottom:-12px;width:12px;height:12px;border:0;background:#2a1d3e;clip-path:polygon(0 0,100% 0,100% 34%,67% 34%,67% 67%,34% 67%,34% 100%,0 100%)}
.bubble::after{content:"";position:absolute;left:-12px;bottom:12px;width:12px;height:12px;border:0;background:#2a1d3e;clip-path:polygon(100% 0,100% 100%,0 100%,0 67%,34% 67%,34% 34%,67% 34%,67% 0)}
.bubble.bad{background:#ffe2e6}.bubble.bad::after{border:0}
.gb::after{display:none}
.egg,.icon-btn svg,.gem svg{image-rendering:pixelated}
.c-art{display:grid;place-items:center}.c-art svg{width:86%;height:auto;overflow:hidden!important}
.worldhead{margin:26px 0 14px;padding:14px 16px;border:4px solid var(--line);background:linear-gradient(90deg,#2a2238,#3a2f4e);box-shadow:6px 6px 0 rgba(4,6,24,.65)}
.worldhead span{font-size:13px;letter-spacing:.14em;color:var(--gold)}.worldhead h3{font-size:30px}
.worldhead.w2{background:linear-gradient(90deg,#1e3a1e,#2e4a28)}.worldhead.w3{background:linear-gradient(90deg,#2e2a3e,#5a5470)}
.worldhead.shut{opacity:.75}.worldhead p{margin:6px 0 0;display:flex;align-items:center;gap:8px}.worldhead p svg{width:18px}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.pl{background:#1b1626;border:3px solid var(--line);padding:8px;cursor:pointer;display:grid;justify-items:center;gap:2px;color:var(--ink);font-family:var(--display)}
.pl.on{border-color:var(--gold)}.pl svg{width:80px}.pl b{font-size:18px}.pl small{color:var(--muted)}
.pl.add span{font-size:56px;line-height:80px;color:var(--volt)}
.fthumb{cursor:pointer;position:relative;overflow:hidden;color:var(--ink);font-family:var(--display)}
.fthumb.holo::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:color-dodge;opacity:.6;background:linear-gradient(115deg,transparent 20%,#ff8fc8 30%,#ffd84d 38%,#4de08a 46%,#3ee6ff 54%,#a78bfa 62%,transparent 72%);background-size:250% 250%;animation:holo 3.5s linear infinite}
.fthumb.gold{background:radial-gradient(circle,#fff2b8,#8a6420)}.fthumb.diamond{background:radial-gradient(circle,#ffffff,#6a8ad8)}
.bigstars svg{fill:none;stroke:none;image-rendering:pixelated}.bigstars svg:not(.on){filter:grayscale(1) brightness(.45)}
.met .rock{border-radius:0!important;background:center/contain no-repeat!important;image-rendering:pixelated;border:0!important;box-shadow:-10px -14px 0 -4px #ff9a3a,-18px -22px 0 -6px #ffe27a!important}
.diffbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:-4px 0 14px;font-family:var(--display)}
.gradebox{padding:16px;display:grid;grid-template-columns:1fr 1.6fr;gap:16px;margin-bottom:12px;border-color:var(--gold)}
.gradebox h3{font-size:30px;color:var(--gold);margin:4px 0}
@media (max-width:700px){.gradebox{grid-template-columns:1fr}}
.heroes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.swatch{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.swatch button{width:34px;height:34px;border:3px solid #1b1626;cursor:pointer}.swatch button.on{border-color:#fff;box-shadow:0 0 0 2px #f0c860}
.bighero{width:140px;margin:0 auto}.heroes .pl svg{width:70px}
@media(max-width:480px){.heroes{grid-template-columns:repeat(2,1fr)}}
.elab{border:3px solid #1b1626!important;background:#fffaf0!important;color:#2a1d3e!important;box-shadow:3px 3px 0 rgba(10,6,20,.5)!important}
.elab i.on{color:#2e9a52!important}.elab.friend{border-color:#1b1626!important}.elab em{color:#2e8a4a!important}
.foe .cage{border:0!important;box-shadow:none!important;padding:6%!important;background:repeating-linear-gradient(90deg,transparent 0 14%,rgba(30,20,40,.85) 14% 19%)!important;outline:none}
.foe .cage::before{content:"";position:absolute;inset:0;border-top:5px solid rgba(30,20,40,.85);border-bottom:5px solid rgba(30,20,40,.85);pointer-events:none}
.foe .cage{position:relative}.foe.friend .cage{background:none!important}.foe.friend .cage::before{display:none}
.glitch-arena{background:#2e2258}.ent.locked::after{border-color:#f0c860}

<script>
const PX=(()=>{
/* Keyling pixel-art engine: shapes on a grid -> auto shading + colored outlines */
function shadeHex(h,a){const n=parseInt(h.slice(1),16),f=v=>Math.max(0,Math.min(255,Math.round(a<0?v*(1+a):v+(255-v)*a)));return '#'+((1<<24)|(f(n>>16)<<16)|(f(n>>8&255)<<8)|f(n&255)).toString(16).slice(1)}
let MID=0;
const M=(b,o)=>({id:++MID,b,l:shadeHex(b,.32),d:shadeHex(b,-.28),o:o||shadeHex(b,-.68)});
const F=c=>({id:++MID,b:c,l:c,d:c,o:shadeHex(c,-.6),flat:1});
class Spr{
 constructor(w=32,h=32,k=2){this.k=k;this.w=w*k;this.h=h*k;this.g=new Array(this.w*this.h).fill(null);this.S=1;this.ox=16;this.oy=31}
 form(f){this.S=[.72,.86,1][f];return this}
 X(x){return this.ox+(x-this.ox)*this.S} Y(y){return this.oy+(y-this.oy)*this.S}
 iX(x){return this.ox+(x-this.ox)/this.S} iY(y){return this.oy+(y-this.oy)/this.S}
 raw(x,y,m){if(x>=0&&y>=0&&x<this.w&&y<this.h)this.g[y*this.w+x]=m}
 set(x,y,m){const k=this.k;x=Math.round(this.X(x));y=Math.round(this.Y(y));for(let j=0;j<k;j++)for(let i=0;i<k;i++)this.raw(x*k+i,y*k+j,m)}
 get(x,y){return x>=0&&y>=0&&x<this.w&&y<this.h?this.g[y*this.w+x]:null}
 ell(cx,cy,rx,ry,m){const k=this.k;cx=this.X(cx);cy=this.Y(cy);rx*=this.S;ry*=this.S;for(let y=0;y<this.h;y++)for(let x=0;x<this.w;x++){const dx=((x+.5)/k-cx)/rx,dy=((y+.5)/k-cy)/ry;if(dx*dx+dy*dy<=1)this.raw(x,y,m)}return this}
 rect(x,y,w,h,m){return this.poly([[x,y],[x+w,y],[x+w,y+h],[x,y+h]],m)}
 poly(p,m){const k=this.k;p=p.map(([a,b])=>[this.X(a),this.Y(b)]);for(let y=0;y<this.h;y++)for(let x=0;x<this.w;x++){let c=false;const px=(x+.5)/k,py=(y+.5)/k;for(let i=0,j=p.length-1;i<p.length;j=i++){const[xi,yi]=p[i],[xj,yj]=p[j];if(((yi>py)!==(yj>py))&&(px<(xj-xi)*(py-yi)/(yj-yi)+xi))c=!c}if(c)this.raw(x,y,m)}return this}
 line(x0,y0,x1,y1,m,t=1){x0=this.X(x0);y0=this.Y(y0);x1=this.X(x1);y1=this.Y(y1);t*=this.S;const k=this.k,n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0))*k*2||1,T=Math.max(1,Math.round(t*k));for(let s=0;s<=n;s++){const x=(x0+(x1-x0)*s/n)*k,y=(y0+(y1-y0)*s/n)*k;for(let a=0;a<T;a++)for(let b=0;b<T;b++)this.raw(Math.floor(x)+a,Math.floor(y)+b,m)}return this}
 px(list,m){list.forEach(([x,y])=>this.set(x,y,m));return this}
 recolor(from,to,pred){const k=this.k;for(let y=0;y<this.h;y++)for(let x=0;x<this.w;x++)if(this.get(x,y)===from&&pred(Math.floor(this.iX(x/k)),Math.floor(this.iY(y/k))))this.raw(x,y,to);return this}
 mirror(fn,axis){const tmp=new Spr(this.w/this.k,this.h/this.k,this.k);tmp.S=this.S;fn(tmp);axis=this.X(axis);for(let y=0;y<this.h;y++)for(let x=0;x<this.w;x++){const m=tmp.get(x,y);if(m){this.raw(x,y,m);this.raw(2*axis*this.k-1-x,y,m)}}return this}
 colors(){const W=this.w,H=this.h,out=new Array(W*H).fill(null);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const m=this.get(x,y);
   if(m){out[y*W+x]=m.b;continue}
   const n=[[0,1],[0,-1],[1,0],[-1,0]].map(([a,b])=>this.get(x+a,y+b)).find(Boolean);if(n)out[y*W+x]=n.o}
  // inner lines between different materials (non-flat): draw outline on the lower/right part's border
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const m=this.get(x,y);if(!m||m.flat)continue;const u=this.get(x,y-1),l=this.get(x-1,y);if((u&&u!==m&&!u.flat&&u.line!==m.id&&!m.noline)||(l&&l!==m&&!l.flat&&!m.noline))out[y*W+x]=m.o}
  return out}
 canvas(scale=4){const c=document.createElement('canvas');c.width=this.w*scale;c.height=this.h*scale;const g=c.getContext('2d');const col=this.colors();
  col.forEach((v,i)=>{if(v){g.fillStyle=v;g.fillRect((i%this.w)*scale,Math.floor(i/this.w)*scale,scale,scale)}});return c}
 url(scale=4){return this.canvas(scale).toDataURL()}
}
const EYE=(s,x,y,iris,h=3)=>{const k=s.k,X=Math.round(s.X(x)*k),Y=Math.round(s.Y(y)*k),W=Math.round(2.6*k),Hh=Math.round((h+.6)*k),dk=F('#16121e'),wh=F('#ffffff'),ir=F(iris);
 for(let j=0;j<Hh;j++)for(let i=0;i<W;i++){const corner=(i===0||i===W-1)&&(j===0||j===Hh-1);if(!corner)s.raw(X+i,Y+j,dk)}
 for(let j=Math.ceil(Hh*.55);j<Hh-1;j++)for(let i=1;i<W-1;i++)s.raw(X+i,Y+j,ir);
 s.raw(X+1,Y+1,wh);s.raw(X+2,Y+1,wh);s.raw(X+1,Y+2,wh);s.raw(X+2,Y+2,wh);s.raw(X+W-2,Y+Hh-2,wh);return s};
/* ---------- SPRITES (32-unit design grid, rendered 64x64) ---------- */
const W_=F('#ffffff'),MO=F('#7a1a2a'),TG=F('#ff8aa6');
const mouth=(s,x,y,w=4)=>{for(let i=0;i<w;i++)s.set(x+i,y,MO);for(let i=1;i<w-1;i++)s.set(x+i,y+1,TG);return s};
const smile=(s,x,y,c='#2a1430')=>{const m=F(c);s.px([[x,y],[x+1,y+1],[x+2,y+1],[x+3,y]],m);return s};
const blushP=(s,pts)=>s.px(pts,F('#ff8fb4'));
const star=(cx,cy,r)=>{let p=[];for(let i=0;i<10;i++){const a=Math.PI/5*i-Math.PI/2,rr=i%2?r*.45:r;p.push([cx+Math.cos(a)*rr,cy+Math.sin(a)*rr])}return p};

const SPECIES_SPR=[
/*0 Sproutle*/ f=>{const s=new Spr().form(f),P=M('#ffa8c8','#7a2a52'),Wb=M('#fff0f6','#7a2a52'),G=M('#7ddc6a','#1f5a2a'),Fl=F('#ffd23a');
  s.ell(24,25,4.5,3.2,P).px([[27,21],[29,21],[28,20],[28,22]],W_).set(28,21,Fl);
  s.ell(12,29.5,2.5,1.5,P).ell(20,29.5,2.5,1.5,P).ell(16,23,6.5,6.5,P).ell(16,24.5,3.5,4,Wb);
  s.line(10,21,6,16,P,2).line(21,21,25,16,P,2);
  s.mirror(t=>{t.poly([[8,9],[1,4],[1,7],[5,10]],G);t.poly([[7,12],[0,11],[0,14],[7,14]],G);t.poly([[8,16],[1,18],[2,20],[8,17]],G);if(f>0)t.poly([[9,7],[5,1],[4,3],[8,8]],G)},16);
  s.ell(16,13,9.5,7,P);if(f>0)s.px([[12,8],[20,8],[16,7]],F('#ffd0e4'));
  if(f===2){[[11,5],[16,4],[21,5]].forEach(([x,y])=>{s.px([[x-1,y],[x+1,y],[x,y-1],[x,y+1]],W_).set(x,y,Fl)})}
  EYE(s,11,11,'#4a1a50');EYE(s,19,11,'#4a1a50');mouth(s,14,16);blushP(s,[[9,15],[23,15]]);return s},

function startBoss(){G.phase='boss';const king=G.i>=15;const e=spawnEnt({kind:'bad',size:'l'});e.boss=true;e.big=1.7;e.z=.42;e.lane=0;e.hp=3;e.sp.innerHTML=villainArc(0,true);e.sp.classList.add('bossent');G.boss=e;G.tgt=e;bossPhrase();gmsg(king?'Boss!':'Boss!','big boss');tone(90,.6,'sawtooth',.1)}
function bossPhrase(){const b=G.boss;b.txt=G.i>=16?rand(SENT.filter(s=>s.length<=22)):G.ok.length>=8?fillWords(G.ok,11):groups(()=>rand(G.letters),7,2,3);b.typed=0;b.t=0;b.lim=b.txt.length*1.5/G.speed+4;paintLab(b);gHint()}
function bossAttack(){G.hearts--;kick($('#gflash'),'on');kick($('#garena'),'quake');kick(G.boss.sp,'stomp');sfx.bad();tone(80,.4,'sawtooth',.1);gmsg('Ouch!','bad');gUp();bossPhrase()}
function gHint(){let t=null;const e=G.tgt;if(e&&!e.dead)t=e.txt[e.typed];else{const c=G.ents.filter(x=>x.kind==='bad'&&!x.dead);if(c.length)t=c.reduce((a,b)=>a.z>b.z?a:b).txt[0];else if(G.ents.length)t=G.ents[0].txt[0]}G.next=t;setTarget(t);$('#ghint').innerHTML=t?fingerHTML(t):''}
function gUp(){$('#g-a').textContent=G.score;$('#g-b').textContent=G.hearts>0?'♥'.repeat(G.hearts):'0';const c=$('#gcombo');if(c){c.textContent=G.combo>=3?`${G.combo} combo${G.combo>=10?' ×'+(1+Math.floor(G.combo/10)):''}`:'';c.classList.toggle('hot',G.combo>=10)}}
function glitchInput(ch,caps){
 let e=G.tgt&&!G.tgt.dead?G.tgt:null;
 if(!e){const c=G.ents.filter(x=>!x.dead&&matchKey(ch,x.txt[0],caps));if(c.length)e=c.reduce((a,b)=>(a.kind==='friend'?.5:a.z)>(b.kind==='friend'?.5:b.z)?a:b)}
 if(e&&matchKey(ch,e.txt[e.typed],caps)){
  const prev=G.tgt;G.tgt=e;if(prev&&prev!==e&&!prev.dead)paintLab(prev);
  e.typed++;G.hits++;G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);

function endGlitch(win){

 const best=G.score>S.arc.glitch;if(best)S.arc.glitch=G.score;if(win)S.arc.gwin++;

}

const PXC={};
const pxu=(key,mk,sc=4)=>PXC[key]||(PXC[key]=mk().url(sc));
const pximg=(cls,url,extra='')=>`<svg class="${cls}" viewBox="0 0 200 200" aria-hidden="true" ${extra}><image href="${url}" x="0" y="0" width="200" height="200" preserveAspectRatio="xMidYMax meet"/></svg>`;
function creatureSVG(i,form,cls=''){return pximg('cr '+cls,pxu('s'+i+'-'+form,()=>PX.SPR.species(i,form)))}
function zookSVG(eq){eq=eq||S.equip;const k='z'+JSON.stringify(eq);return pximg('zk',pxu(k,()=>PX.SPR.zook(eq)))}
function glitchSVG(v=0,king=false){const c=GV[v%GV.length];return pximg('gl',pxu('g'+c+king,()=>PX.SPR.glitch(c,king)))}
function keystoneSVG(){return pximg('ks',pxu('ks',()=>PX.SPR.keystone()))}
const SCN={};
function sceneSVG(c){const kind=['meadow','cave','volcano','sky','star'][REGIONS.findIndex(r=>r.color===c)]||'meadow';const u=SCN[kind]||(SCN[kind]=PX.pixelScene(kind).toDataURL());
 return `<svg class="scene" viewBox="0 0 200 72" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><image href="${u}" width="200" height="72"/></svg>`}
function pathScene(){const u=SCN.road||(SCN.road=PX.roadScene().toDataURL());return `<svg class="scene" viewBox="0 0 160 100" preserveAspectRatio="none" aria-hidden="true"><image href="${u}" width="160" height="100" preserveAspectRatio="none"/></svg>`}
/* Keystone catch */
function catchAnim(done){
 const a=$('#arena'),h=$('#hero'),f=$('#foe');if(!a||!h||!f)return done();
 const ar=a.getBoundingClientRect(),hr=h.getBoundingClientRect(),fr=f.getBoundingClientRect();
 const k=document.createElement('div');k.className='kstone';k.innerHTML=keystoneSVG();
 const x1=hr.left-ar.left+hr.width*.6,y1=hr.top-ar.top+hr.height*.3,x2=fr.left-ar.left+fr.width/2,y2=fr.top-ar.top+fr.height*.75;
 k.style.cssText=`left:${x1}px;top:${y1}px`;a.appendChild(k);say('Go, Keystone!');tone(520,.15,'square',.06);
 requestAnimationFrame(()=>{k.style.transition='left .5s linear, top .5s cubic-bezier(.2,-0.8,.6,1)';k.style.left=x2+'px';k.style.top=y2+'px'});
 setTimeout(()=>{f.classList.add('caught');burst(a,f,'#3ee6ff',10);tone(880,.1,'square',.06)},520);
 setTimeout(()=>{k.classList.add('wob')},900);
 [1100,1500,1900].forEach((t,i)=>setTimeout(()=>tone(300+i*80,.08,'square',.06),t));
 setTimeout(()=>{k.classList.remove('wob');k.classList.add('click');burst(a,k,'#ffd23a',14);sfx.win();say('Caught!')},2300);
 setTimeout(done,3100);
}
